<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11 Desktop (26H2)</title>
    <style>
        :root {
            --taskbar-bg: rgba(20, 20, 20, 0.6);
            --window-bg: rgba(25, 25, 25, 0.85);
            --window-border: rgba(255, 255, 255, 0.1);
            --accent-color: #0078d4;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --sidebar-bg: rgba(35, 35, 35, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-drag: none;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            overflow: hidden;
            color: var(--text-main);
        }

        /* Desktop App Layout Workspace */
        .desktop-workspace {
            position: relative;
            height: calc(100vh - 56px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-content: flex-start;
            flex-wrap: wrap;
        }

        .desktop-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90px;
            padding: 10px 6px;
            gap: 8px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            border: 1px solid transparent;
            transition: all 0.1s ease;
        }

        .desktop-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.05);
        }

        .desktop-item svg {
            width: 42px;
            height: 42px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .desktop-item span {
            font-size: 12px;
            font-weight: 400;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            line-height: 1.3;
        }

        /* Centered Floating Windows 11 Dock Taskbar */
        .taskbar-dock {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            height: 48px;
            background: var(--taskbar-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 0 8px;
            gap: 4px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            z-index: 9999;
        }

        .dock-segment {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 100%;
        }

        .dock-divider {
            width: 1px;
            height: 24px;
            background: rgba(255,255,255,0.15);
            margin: 0 6px;
        }

        .dock-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 1, 0.2, 1);
            position: relative;
        }

        .dock-icon:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-4px);
        }

        .dock-icon svg {
            width: 26px;
            height: 26px;
        }

        /* Real-time System Info Widget */
        .system-tray-widget {
            padding: 0 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: rgba(255,255,255,0.9);
            min-width: 70px;
        }

        /* High Fidelity Window Shell Components */
        .app-window {
            position: absolute;
            width: 760px;
            height: 490px;
            background: var(--window-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--window-border);
            border-radius: 10px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 100;
        }

        .window-titlebar {
            padding: 12px 16px;
            background: rgba(15, 15, 15, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .window-title {
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .window-actions {
            display: flex;
            gap: 14px;
        }

        .action-btn {
            cursor: pointer;
            font-size: 13px;
            opacity: 0.6;
            transition: opacity 0.1s;
        }

        .action-btn:hover {
            opacity: 1;
        }

        .action-close:hover {
            color: #ff5f56;
        }

        .window-content-split {
            display: flex;
            flex: 1;
            height: calc(100% - 41px);
        }

        .window-sidebar {
            width: 190px;
            background: var(--sidebar-bg);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-right: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar-item {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12.5px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .sidebar-item:hover, .sidebar-item.active {
            background: rgba(255,255,255,0.06);
        }

        .window-view-pane {
            padding: 24px;
            flex: 1;
            overflow-y: auto;
        }

        /* Mock App Elements */
        .browser-iframe-mock {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }
    </style>
</head>
<body>

    <main class="desktop-workspace">
        <div class="desktop-item" onclick="toggleWindow('explorer-win')">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">

                <path d="M40 16H12L6 40H40C42.2091 40 44 38.2091 44 36V20C44 17.7909 42.2091 16 40 16Z" fill="#FFCA28"/>
            </svg>
            <span>This PC</span>
        </div>

        <div class="desktop-item" onclick="toggleWindow('edge-win')">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M24 4C12.95 4 4 12.95 4 24C4 35.05 12.95 44 24 44C35.05 44 44 35.05 44 24C44 12.95 35.05 4 24 4ZM24 38C16.28 38 10 31.72 10 24C10 16.28 16.28 10 24 10C31.72 10 38 16.28 38 24C38 31.72 31.72 38 24 38Z" fill="#0078D4"/>
                <path d="M24 14C18.48 14 14 18.48 14 24C14 29.52 18.48 34 24 34C29.52 34 34 29.52 34 24C34 18.48 29.52 14 24 14Z" fill="#00C4FF"/>
            </svg>
            <span>Edge Browser</span>
        </div>
    </main>

    <div class="app-window" id="explorer-win" style="top: 15%; left: 20%;">
        <div class="window-titlebar" id="explorer-win-header">
            <div class="window-title">📁 File Explorer</div>
            <div class="window-actions">
                <span class="action-btn action-close" onclick="toggleWindow('explorer-win')">✕</span>
            </div>
        </div>
        <div class="window-content-split">
            <aside class="window-sidebar">
                <div class="sidebar-item active">🏠 Quick Access</div>
                <div class="sidebar-item">🖥️ Local Disk (C:)</div>
                <div class="sidebar-item">📦 Cloud Repositories</div>
            </aside>
            <div class="window-view-pane">
                <h3 style="margin-bottom: 12px;">
