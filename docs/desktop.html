<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11 Desktop (26H2 Extended)</title>
    <link rel="stylesheet" href="desktop.css">
    <style>
        /* Interactive inner components */
        .browser-container, .notepad-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background: #fff;
            color: #000;
        }
        .browser-navbar, .notepad-menu {
            background: #f3f3f3;
            padding: 8px;
            display: flex;
            gap: 8px;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
        }
        .browser-address-bar {
            flex: 1;
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 13px;
            outline: none;
        }
        .browser-content {
            flex: 1;
            padding: 40px;
            background: #f9f9f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
        }
        .search-engine-logo {
            font-size: 42px;
            font-weight: bold;
            background: linear-gradient(45deg, #0078d4, #00c4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
        .search-engine-input {
            width: 80%;
            max-width: 500px;
            padding: 12px 20px;
            border-radius: 24px;
            border: 1px solid #ddd;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            font-size: 16px;
            outline: none;
        }
        .notepad-textarea {
            flex: 1;
            width: 100%;
            padding: 12px;
            border: none;
            outline: none;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            resize: none;
        }
        
        /* Explorer Folder Grid system */
        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }
        .folder-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            text-align: center;
            font-size: 12px;
            padding: 8px;
            border-radius: 4px;
        }
        .folder-item:hover {
            background: rgba(255,255,255,0.05);
        }
        .folder-item svg {
            width: 44px;
            height: 44px;
        }

        /* Taskbar Widgets Flyout Panel */
