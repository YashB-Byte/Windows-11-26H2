<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11 26H2 - Booting</title>
    <style>
        body {
            background: #000;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }
        .logo-container {
            margin-bottom: 40px;
        }
        .win-logo {
            width: 100px;
            height: 100px;
        }
        /* Win11 Spinner */
        .spinner {
            width: 40px;
            height: 40px;
            position: relative;
        }
        .dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            animation: spin 3.5s infinite cubic-bezier(0.1, 0.9, 0.2, 1);
            opacity: 0;
        }
        .dot:nth-child(1) { animation-delay: 0.15s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.45s; }
        .dot:nth-child(4) { animation-delay: 0.6s; }
        .dot:nth-child(5) { animation-delay: 0.75s; }

        @keyframes spin {
            0% { transform: rotate(0deg); opacity: 0; }
            5% { opacity: 1; }
            70% { transform: rotate(720deg); opacity: 1; }
            85% { opacity: 0; }
            100% { transform: rotate(1080deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <svg class="win-logo" viewBox="0 0 24 24" fill="#0078d4">
            <path d="M0 0h11.314v11.314H0V0zm12.686 0H24v11.314H12.686V0zM0 12.686h11.314V24H0V12.686zm12.686 0H24V24H12.686V12.686z"/>
        </svg>
    </div>

    <div class="spinner">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <script>
        // Simulate real OS initialization time before loading the core desktop UI
        setTimeout(() => {
            window.location.href = 'desktop.html';
        }, 3500);
    </script>
</body>
</html>
